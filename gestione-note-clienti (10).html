<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Note Clienti</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --radius: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px 24px; line-height: 1.5; }
        .container { width: 100%; max-width: 1560px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .header-title-group h1 { font-size: 1.8rem; color: var(--primary); font-weight: 700; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; border: 1px solid var(--border); background-color: var(--card-bg); color: var(--primary); cursor: pointer; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background-color: var(--accent); color: white; border: none; }
        .btn-primary:hover { background-color: var(--accent-hover); color: white; }
        .card { background-color: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border); }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .input-control, .select-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #fff; outline: none; }
        .input-control:focus, .select-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .models-container { display: flex; flex-direction: column; gap: 10px; }
        .model-select-row { display: flex; gap: 8px; align-items: center; }
        .model-actions-btns { display: flex; gap: 4px; }
        .btn-icon { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: #f8fafc; cursor: pointer; }
        .btn-icon.danger:hover { background-color: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
        .btn-add-subfield { background: none; border: 1px dashed var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer; margin-top: 4px; align-self: flex-start; }
        .search-card { background: var(--card-bg); border-radius: var(--radius); padding: 14px 20px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .search-input { flex-grow: 1; padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
        
        /* Barca Rapida Tappe */
        .stages-nav-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; white-space: nowrap; }
        .stage-pill { background: var(--card-bg); border: 1px solid var(--border); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: all 0.2s; }
        .stage-pill:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .stage-group { margin-bottom: 24px; background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); scroll-margin-top: 20px; }
        .stage-header { background: var(--primary); color: white; padding: 14px 20px; font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .stage-footer { padding: 14px 20px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
        .btn-route { background: #7c3aed; color: white; border: none; }
        .btn-route-alt { background: #0284c7; color: white; border: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background: #f8fafc; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .client-info strong { display: block; font-size: 1.1rem; color: var(--primary); margin-bottom: 4px; }
        .models-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
        .model-badge { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .model-qta-badge { background: var(--accent); color: white; font-size: 0.75rem; padding: 1px 6px; border-radius: 8px; cursor: pointer; }
        .btn-del-badge { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-add-inline { background: #f1f5f9; border: 1px dashed #cbd5e1; color: #475569; border-radius: 12px; padding: 4px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .client-location-link { display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 10px; }
        .client-badge-meta { display: inline-block; font-size: 0.75rem; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); font-weight: 600; margin-right: 4px; }
        .edit-controls { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .edit-group { display: flex; align-items: center; gap: 4px; }
        .edit-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
        .edit-input, .edit-select { padding: 4px 8px; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
        .status-cell { text-align: center; cursor: pointer; user-select: none; width: 120px; }
        .checkbox-x { display: inline-flex; justify-content: center; align-items: center; width: 32px; height: 32px; border: 2px solid #cbd5e1; border-radius: 8px; font-weight: bold; font-size: 1.1rem; color: transparent; background: #fff; margin: 0 auto; transition: 0.2s; pointer-events: none; }
        .status-cell.active .checkbox-x { background: #dbeafe; border-color: var(--accent); color: var(--accent); }
        .status-cell:hover .checkbox-x { border-color: var(--accent); }
        .disp-cell { min-width: 300px; }
        .disp-container { display: flex; align-items: center; gap: 10px; }
        .note-input { flex-grow: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none; }
        .note-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .inline-add-box { margin-top: 8px; padding: 10px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; border-radius: var(--radius); padding: 24px; max-width: 500px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-header h3 { font-size: 1.2rem; color: var(--primary); }
        .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }
        .modal-body { max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .modal-model-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }

        /* Bottone torna in alto */
        .btn-back-to-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            z-index: 900;
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity 0.25s, transform 0.2s;
            opacity: 0;
        }
        .btn-back-to-top.visible {
            display: flex;
            opacity: 1;
        }
        .btn-back-to-top:hover {
            background: var(--accent-hover);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="header-title-group">
            <h1>📋 Gestione Note Clienti</h1>
        </div>
        <div class="header-actions">
            <button type="button" class="btn" onclick="openModelsModal()">⚙️ Modelli</button>
            <button type="button" class="btn" onclick="openSpedizioniModal()">📦 Spedizioni</button>
            <button type="button" class="btn" onclick="exportBackup()">💾 Scarica Backup</button>
            <button type="button" class="btn" onclick="document.getElementById('importFileInput').click()">📂 Ripristina</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importBackup(event)">
        </div>
    </div>

    <div class="card">
        <div class="card-title">➕ Aggiungi Nuovo Cliente</div>
        <form id="clientForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome Cliente</label>
                    <input type="text" id="nome" class="input-control" required placeholder="Es. Mario Rossi" oninput="onNomeInput()">
                </div>
                
                <div class="form-group" style="grid-column: span 2;">
                    <label>Modello/i e Quantità</label>
                    <div id="modelsContainer" class="models-container"></div>
                    <button type="button" class="btn-add-subfield" onclick="addModelSelectRow()">+ Aggiungi altro modello</button>
                </div>

                <div class="form-group">
                    <label for="localita">Località / Paese</label>
                    <input type="text" id="localita" class="input-control" required placeholder="Es. Casamassima" oninput="onLocalitaInput(this.value)">
                </div>

                <div class="form-group">
                    <label for="provincia">Provincia</label>
                    <select id="provincia" class="select-control" required>
                        <option value="">Seleziona provincia...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="regione">Regione</label>
                    <select id="regione" class="select-control" required>
                        <option value="">Seleziona regione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tappaInput">Tappa</label>
                    <input type="text" id="tappaInput" class="input-control" list="tappeDatalist" placeholder="Scrivi o seleziona tappa..." autocomplete="off" oninput="onTappaOrSpedizioneInput('tappa')">
                    <datalist id="tappeDatalist"></datalist>
                </div>

                <div class="form-group">
                    <label for="spedizioneInput">Spedizione</label>
                    <input type="text" id="spedizioneInput" class="input-control" list="spedizioniDatalist" placeholder="Scrivi o seleziona spedizione..." autocomplete="off" oninput="onSpedizioneInput()" onchange="onSpedizioneInput()">
                    <datalist id="spedizioniDatalist"></datalist>
                </div>

                <div class="form-group">
                    <label for="data">Data</label>
                    <input type="date" id="data" class="input-control" required>
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">+ Aggiungi Cliente</button>
        </form>
    </div>

    <datalist id="modelliDatalist"></datalist>

    <div class="search-card">
        <span style="font-weight: 700; color: var(--primary);">🔍 Cerca:</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Filtra per cliente, località, provincia, regione, modello o note..." oninput="render()">
    </div>

    <!-- BARRA DI NAVIGAZIONE RAPIDA TAPPE -->
    <div id="stagesNavBar" class="stages-nav-bar"></div>

    <!-- BARRA DI NAVIGAZIONE RAPIDA SPEDIZIONI -->
    <div id="spedizioniNavBar" class="stages-nav-bar"></div>

    <div id="tablesContainer"></div>
</div>

<div id="modelsModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>⚙️ Modelli Salvati</h3>
            <button class="modal-close" onclick="closeModelsModal()">✕</button>
        </div>
        <div class="modal-body" id="modalModelsList"></div>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-primary" style="flex: 1;" onclick="promptNewModel()">+ Nuovo Modello</button>
            <button type="button" class="btn" onclick="closeModelsModal()">Chiudi</button>
        </div>
    </div>
</div>

<div id="spedizioniModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>📦 Spedizioni Memorizzate</h3>
            <button class="modal-close" onclick="closeSpedizioniModal()">✕</button>
        </div>
        <div class="modal-body" id="modalSpedizioniList"></div>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="btn" style="flex: 1;" onclick="closeSpedizioniModal()">Chiudi</button>
        </div>
    </div>
</div>

    function resolveLocationData(localitaStr) {
        if (!localitaStr) return { prov: "", reg: "" };
        const text = localitaStr.toLowerCase().trim();
        // Preferisce la chiave più lunga che combacia (es. "reggio calabria" vince su "reggio")
        let best = null;
        let bestLen = 0;
        for (const item of LOCATION_DATABASE) {
            for (const kw of item.keys) {
                if (text.includes(kw) && kw.length > bestLen) {
                    best = item;
                    bestLen = kw.length;
                }
            }
        }
        if (best) return { prov: best.prov, reg: best.reg };
        return { prov: "", reg: "" };
    }

    window.onLocalitaInput = function(val) {
        const res = resolveLocationData(val);
        if (res.prov) provinciaSelect.value = res.prov;
        if (res.reg) regioneSelect.value = res.reg;

    function sortClientsGeographically(list) {
        if (list.length <= 1) return list;
        let unvisited = [...list];
        let sorted = [];
        let current = unvisited.shift();
        sorted.push(current);

        while (unvisited.length > 0) {
            let nearestIdx = 0;
            let minDiff = Infinity;
            for (let i = 0; i < unvisited.length; i++) {
                let locA = current.localita.toLowerCase().trim();
                let locB = unvisited[i].localita.toLowerCase().trim();
                let diff = Math.abs(locA.length - locB.length);
                if (locA === locB) diff = -10;
                if (diff < minDiff) { minDiff = diff; nearestIdx = i; }
            }
            current = unvisited.splice(nearestIdx, 1)[0];
            sorted.push(current);
        }
        return sorted;
    }

    window.openRoute = function(stageClients, startFromCasamassima) {
        if (!stageClients || stageClients.length === 0) return;
        let orderedClients = sortClientsGeographically(stageClients);
        const locations = orderedClients.map(c => c.localita.trim()).filter(l => l !== '');
        if (locations.length === 0) return;

        let origin = startFromCasamassima ? 'Casamassima, BA' : locations[0];
        let destination = locations[locations.length - 1];
        let waypoints = startFromCasamassima ? locations.slice(0, -1) : locations.slice(1, -1);

        let mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`;
        if (waypoints.length > 0) {
            mapUrl += `&waypoints=${waypoints.map(w => encodeURIComponent(w)).join('|')}`;
        }
        window.open(mapUrl, '_blank');
    }

    window.importBackup = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (imported.clients && confirm("Ripristinare i dati?")) {
                    clients = imported.clients.map(client => {
                        const resolved = resolveLocationData(client.localita);
                        return {
                            ...client,
                            provincia: resolved.prov || client.provincia || '',
                            regione: resolved.reg || client.regione || '',
                            spedizione: client.spedizione || ''
                        };
                    });

                    if (imported.savedModels) savedModels = imported.savedModels;
                    if (imported.savedSpedizioni) savedSpedizioni = imported.savedSpedizioni;
                    saveToLocalStorage();
                    localStorage.setItem('note_clienti_modelli', JSON.stringify(savedModels));
                    localStorage.setItem('note_clienti_spedizioni', JSON.stringify(savedSpedizioni));
                    init();
                    alert("Ripristino e correzione automatica completati!");
                }
            } catch (err) {
                alert("Errore file backup.");
            }
        };
        reader.readAsText(file);
    }

    function render() {
        // Normalizza campi di ogni cliente
        clients.forEach(c => {
            if (c.spedizione === undefined) c.spedizione = '';
            c.calendarizzato = (c.calendarizzato === true || c.calendarizzato === 'true');
            c.preavviso = (c.preavviso === true || c.preavviso === 'true');
            c.disponibilita = (c.disponibilita === true || c.disponibilita === 'true');
        });

        // Tappe (solo clienti che hanno tappa e non spedizione)
        const stages = Array.from(new Set(
            clients.filter(c => (c.tappa || '').trim() && !(c.spedizione || '').trim())
                   .map(c => c.tappa.trim())
        )).sort();

        tappeDatalist.innerHTML = '';
        stages.forEach(stage => {
            const opt = document.createElement('option');
            opt.value = stage;
            tappeDatalist.appendChild(opt);
        });

        // Aggiorna solo il datalist (non aggiunge automaticamente i nomi dei clienti)
        updateSpedizioniDatalist();

        // Lista spedizioni per la barra di navigazione (dai clienti)
        const spedizioni = Array.from(new Set(
            clients.filter(c => (c.spedizione || '').trim())
                   .map(c => c.spedizione.trim())
        )).sort();

        // Barra navigazione tappe
        if (stages.length > 0) {
            stagesNavBar.style.display = 'flex';
            stagesNavBar.innerHTML = stages.map(stage => {
                const safeId = stage.replace(/[^a-zA-Z0-9-_]/g, '_');
                return `<button class="stage-pill" onclick="scrollToStage('${safeId}')">🚩 ${stage}</button>`;
            }).join('');
        } else {
            stagesNavBar.style.display = 'none';
        }

        // Barra navigazione spedizioni
        if (spedizioni.length > 0) {
            spedizioniNavBar.style.display = 'flex';
            spedizioniNavBar.innerHTML = spedizioni.map(sped => {
                const safeId = sped.replace(/[^a-zA-Z0-9-_]/g, '_');
                return `<button class="stage-pill" style="border-color:#7c3aed; color:#7c3aed;" onclick="scrollToSpedizione('${safeId}')">📦 ${sped}</button>`;
            }).join('');
        } else {
            spedizioniNavBar.style.display = 'none';
        }

        container.innerHTML = '';
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';

        const filteredClients = clients.filter(c => {
            const matchModels = c.modelli ? c.modelli.some(m => m.nome.toLowerCase().includes(searchTerm)) : false;
            return (
                c.nome.toLowerCase().includes(searchTerm) ||
                matchModels ||
                c.localita.toLowerCase().includes(searchTerm) ||
                (c.provincia && c.provincia.toLowerCase().includes(searchTerm)) ||
                (c.regione && c.regione.toLowerCase().includes(searchTerm)) ||
                (c.tappa && c.tappa.toLowerCase().includes(searchTerm)) ||
                (c.spedizione && c.spedizione.toLowerCase().includes(searchTerm)) ||
                (c.notaDisponibilita && c.notaDisponibilita.toLowerCase().includes(searchTerm))
            );
        });

        if (filteredClients.length === 0) {
            container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 40px;">${searchTerm ? 'Nessun risultato.' : 'Nessun cliente registrato.'}</p>`;
            return;
        }

        // Helper per creare una tabella di gruppo (tappa o spedizione)
        function createGroup(groupName, groupClients, isSpedizione) {
            groupClients.sort((a, b) => new Date(a.data) - new Date(b.data));

            const safeId = groupName.replace(/[^a-zA-Z0-9-_]/g, '_');
            const groupEl = document.createElement('div');
            groupEl.className = 'stage-group';
            groupEl.id = isSpedizione ? `sped-group-${safeId}` : `stage-group-${safeId}`;

            const headerIcon = isSpedizione ? '📦' : '🚩';
            const headerLabel = isSpedizione ? 'Spedizione' : 'Tappa';
            const deleteFn = isSpedizione ? 'deleteSpedizione' : 'deleteStage';
            const headerBg = isSpedizione ? 'background:#7c3aed;' : '';

            let tableHTML = `
                <div class="stage-header" style="${headerBg}">
                    <span>${headerIcon} ${headerLabel}: ${groupName}</span>
                    <button class="btn btn-icon danger" style="color:white; border-color:transparent; background:rgba(255,255,255,0.2)" onclick="${deleteFn}('${groupName.replace(/'/g, "\\'")}')">🗑️ Cancella ${headerLabel}</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente / Modelli</th>
                            <th style="text-align: center;">Calendarizzato</th>
                            <th style="text-align: center;">Preavviso</th>
                            <th>Disponibilità / Note</th>
                            <th style="width: 40px;"></th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            groupClients.forEach(client => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(client.localita)}`;
                const modelsHTML = (client.modelli || []).map((mod, idx) => `
                    <span class="model-badge">
                        ${mod.nome}
                        <span class="model-qta-badge" onclick="editModelQuantity('${client.id}', ${idx})" title="Modifica Q.tà">${mod.qta || 1} pz</span>
                        <button class="btn-del-badge" onclick="removeModelFromClient('${client.id}', ${idx})">×</button>
                    </span>
                `).join('');

                const isAddingModel = (activeInlineAddId === client.id);
                const inlineAddHTML = isAddingModel ? `
                    <div class="inline-add-box">
                        <input type="text" id="inline-model-input-${client.id}" class="input-control" list="modelliDatalist" style="flex:1; min-width:160px;" placeholder="Digita modello..." autocomplete="off">
                        <select id="inline-model-qta-${client.id}" class="select-control" style="width:80px;">
                            ${getQuantityOptionsHTML(1)}
                        </select>
                        <button class="btn btn-primary" style="padding:6px 12px;" onclick="saveInlineModel('${client.id}')">Salva</button>
                        <button class="btn" style="padding:6px 12px;" onclick="toggleInlineAddModel('${client.id}')">✕</button>
                    </div>
                ` : '';

                const provinciaOptionsHTML = ITALIAN_PROVINCES.map(prov => `<option value="${prov}" ${prov === client.provincia ? 'selected' : ''}>${prov}</option>`).join('');
                const regionOptionsHTML = ITALIAN_REGIONS.map(reg => `<option value="${reg}" ${reg === client.regione ? 'selected' : ''}>${reg}</option>`).join('');

                tableHTML += `
                    <tr>
                        <td class="client-info">
                            <strong>${client.nome}</strong>
                            <div class="models-list">
                                ${modelsHTML}
                                <button class="btn-add-inline" onclick="toggleInlineAddModel('${client.id}')">+ modello</button>
                            </div>
                            ${inlineAddHTML}
                            <div style="margin-top: 4px;">
                                <a href="${mapUrl}" target="_blank" rel="noopener" class="client-location-link">📍 ${client.localita} 🔗</a>
                            </div>
                            <div class="edit-controls">
                                <div class="edit-group">
                                    <label>📅 Data:</label>
                                    <input type="date" class="edit-input" value="${client.data || ''}" onchange="updateDate('${client.id}', this.value)">
                                </div>
                                <div class="edit-group">
                                    <label>🏷️ Prov:</label>
                                    <select class="edit-select" onchange="updateProvincia('${client.id}', this.value)">
                                        <option value="">-</option>
                                        ${provinciaOptionsHTML}
                                    </select>
                                </div>
                                <div class="edit-group">
                                    <label>🏛️ Regione:</label>
                                    <select class="edit-select" onchange="updateRegion('${client.id}', this.value)">
                                        <option value="">-</option>
                                        ${regionOptionsHTML}
                                    </select>
                                </div>
                                ${!isSpedizione ? `
                                <div class="edit-group">
                                    <label>🚩 Tappa:</label>
                                    <input type="text" class="edit-input" value="${client.tappa || ''}" onchange="updateStage('${client.id}', this.value)">
                                </div>
                                ` : ''}
                            </div>
                        </td>
                        <td class="status-cell ${(client.calendarizzato === true) ? 'active' : ''}" data-toggle-id="${client.id}" data-toggle-field="calendarizzato">
                            <div class="checkbox-x">${(client.calendarizzato === true) ? '✓' : ''}</div>
                        </td>
                        <td class="status-cell ${(client.preavviso === true) ? 'active' : ''}" data-toggle-id="${client.id}" data-toggle-field="preavviso">
                            <div class="checkbox-x">${(client.preavviso === true) ? '✓' : ''}</div>
                        </td>
                        <td class="disp-cell">
                            <div class="disp-container">
                                <div class="status-cell ${(client.disponibilita === true) ? 'active' : ''}" data-toggle-id="${client.id}" data-toggle-field="disponibilita">
                                    <div class="checkbox-x">${(client.disponibilita === true) ? '✓' : ''}</div>
                                </div>
                                <input type="text" class="note-input" placeholder="Note orario..." value="${client.notaDisponibilita || ''}" data-note-id="${client.id}">
                            </div>
                        </td>
                        <td>
                            <button class="btn-icon danger" onclick="deleteClient('${client.id}')" title="Elimina">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            const groupDataJSON = JSON.stringify(groupClients).replace(/'/g, "&apos;");

            tableHTML += `
                    </tbody>
                </table>
                <div class="stage-footer">
                    <button class="btn btn-route" onclick='openRoute(${groupDataJSON}, true)'>📍 Percorso da Casamassima (BA)</button>
                    <button class="btn btn-route-alt" onclick='openRoute(${groupDataJSON}, false)'>🗺️ Percorso in sequenza</button>
                </div>
            `;
            groupEl.innerHTML = tableHTML;
            container.appendChild(groupEl);
        }

        // 1. Gruppi Tappe (clienti con tappa e senza spedizione)
        const groupedTappe = {};
        filteredClients.forEach(client => {
            const hasSped = (client.spedizione || '').trim();
            const hasTappa = (client.tappa || '').trim();
            if (hasTappa && !hasSped) {
                if (!groupedTappe[hasTappa]) groupedTappe[hasTappa] = [];
                groupedTappe[hasTappa].push(client);
            }
        });
        Object.keys(groupedTappe).sort().forEach(stage => {
            createGroup(stage, groupedTappe[stage], false);
        });

        // 2. Gruppi Spedizioni
        const groupedSped = {};
        filteredClients.forEach(client => {
            const hasSped = (client.spedizione || '').trim();
            if (hasSped) {
                if (!groupedSped[hasSped]) groupedSped[hasSped] = [];
                groupedSped[hasSped].push(client);
            }
        });
        Object.keys(groupedSped).sort().forEach(sped => {
            createGroup(sped, groupedSped[sped], true);
        });

        // 3. Clienti senza tappa né spedizione
        const senzaGruppo = filteredClients.filter(c => !(c.tappa || '').trim() && !(c.spedizione || '').trim());
        if (senzaGruppo.length > 0) {
            createGroup('SENZA TAPPA / SPEDIZIONE', senzaGruppo, false);
        }
    }

    // Bottone "Torna in alto"
    window.scrollToTop = function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.addEventListener('scroll', function() {
        const btn = document.getElementById('backToTopBtn');
        if (!btn) return;
        if (window.scrollY > 300) {
            btn.classList.add('visible');
        } else {
            btn.classList.remove('visible');
        }
    });

    init();
</script>

<button type="button" id="backToTopBtn" class="btn-back-to-top" onclick="scrollToTop()" title="Torna in alto">↑</button>

</body>
</html>
